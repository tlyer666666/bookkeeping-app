name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: |
          node --check core.js
          node --check app.js
          node --check server.js
          node --check sw.js
          node --check desktop/main.js
          node --check desktop/preload.js
      - name: ESLint
        run: npx eslint .
      - name: 单元测试（48 项）
        run: node tests/core.test.js
